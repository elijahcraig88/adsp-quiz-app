// === MarkdownText.js ===
// ADsP Master App - Universal Lightweight React Markdown Renderer
// Safely parses bold (**text**), inline code (`code`), headers (###), lists (- item, 1. item), blockquotes (> text)
// 100% Zero-dependency, Offline PWA compatible, Virtual DOM based (No dangerouslySetInnerHTML)

function MarkdownText({ content, className = '' }) {
  if (!content) return null;
  if (typeof content !== 'string') return React.createElement('span', { className }, String(content));

  // Parse inline elements (bold, code)
  const parseInline = (text, keyPrefix = 'inline') => {
    if (!text) return null;
    const regex = /(\*\*[^\n]+?\*\*|`[^`\n]+?`)/g;
    const parts = text.split(regex);

    return parts.map((part, idx) => {
      if (!part) return null;
      const key = `${keyPrefix}-${idx}`;

      // Bold: **text**
      if (part.startsWith('**') && part.endsWith('**') && part.length >= 4) {
        return React.createElement(
          'strong',
          {
            key,
            className: 'font-extrabold text-slate-900 dark:text-slate-50 bg-amber-500/15 dark:bg-amber-400/20 px-1 py-0.5 rounded text-inherit'
          },
          part.slice(2, -2)
        );
      }

      // Inline Code: `code`
      if (part.startsWith('`') && part.endsWith('`') && part.length >= 2) {
        return React.createElement(
          'code',
          {
            key,
            className: 'font-mono text-[11px] sm:text-xs font-bold text-indigo-700 dark:text-indigo-300 bg-indigo-50 dark:bg-indigo-950/70 border border-indigo-200/70 dark:border-indigo-800/70 px-1.5 py-0.5 rounded-md shadow-xs mx-0.5'
          },
          part.slice(1, -1)
        );
      }

      return React.createElement('span', { key }, part);
    });
  };

  // If content does not contain newlines and className contains 'inline', return inline span
  if (!content.includes('\n') && className.includes('inline')) {
    return React.createElement('span', { className }, parseInline(content, 'single'));
  }

  // Split lines and parse block elements
  const lines = content.split('\n');
  const elements = [];

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const trimmed = line.trim();

    // Empty line -> spacing
    if (!trimmed) {
      elements.push(React.createElement('div', { key: `empty-${i}`, className: 'h-1.5' }));
      continue;
    }

    // Header 3: ### Title
    if (trimmed.startsWith('### ')) {
      elements.push(
        React.createElement(
          'h5',
          {
            key: `h3-${i}`,
            className: 'text-xs sm:text-sm font-black text-indigo-700 dark:text-indigo-400 mt-2.5 mb-1 flex items-center space-x-1.5'
          },
          parseInline(trimmed.slice(4), `h3-${i}`)
        )
      );
      continue;
    }

    // Header 2: ## Title
    if (trimmed.startsWith('## ')) {
      elements.push(
        React.createElement(
          'h4',
          {
            key: `h2-${i}`,
            className: 'text-sm sm:text-base font-black text-indigo-800 dark:text-indigo-300 mt-3 mb-1.5'
          },
          parseInline(trimmed.slice(3), `h2-${i}`)
        )
      );
      continue;
    }

    // Blockquote: > Text
    if (trimmed.startsWith('> ')) {
      elements.push(
        React.createElement(
          'blockquote',
          {
            key: `quote-${i}`,
            className: 'border-l-4 border-indigo-500 pl-3 py-1 my-1.5 bg-indigo-50/40 dark:bg-indigo-950/20 text-xs sm:text-sm text-slate-700 dark:text-slate-300 italic rounded-r-lg'
          },
          parseInline(trimmed.slice(2), `quote-${i}`)
        )
      );
      continue;
    }

    // Bullet List: - Item or * Item or • Item
    const bulletMatch = line.match(/^(\s*)([-*•])\s+(.+)$/);
    if (bulletMatch) {
      const indentLevel = Math.floor(bulletMatch[1].length / 2);
      const itemText = bulletMatch[3];
      elements.push(
        React.createElement(
          'div',
          {
            key: `bullet-${i}`,
            className: `flex items-start space-x-2 my-0.5 leading-relaxed ${indentLevel > 0 ? (indentLevel === 1 ? 'ml-3' : 'ml-6') : ''}`
          },
          [
            React.createElement('span', { key: 'bullet-icon', className: 'text-indigo-500 dark:text-indigo-400 font-bold shrink-0 mt-0.5 select-none text-xs' }, '•'),
            React.createElement('div', { key: 'bullet-content', className: 'flex-1' }, parseInline(itemText, `bullet-${i}`))
          ]
        )
      );
      continue;
    }

    // Numbered List: 1. Item, 2. Item
    const numMatch = line.match(/^(\s*)(\d+)\.\s+(.+)$/);
    if (numMatch) {
      const indentLevel = Math.floor(numMatch[1].length / 2);
      const num = numMatch[2];
      const itemText = numMatch[3];
      elements.push(
        React.createElement(
          'div',
          {
            key: `num-${i}`,
            className: `flex items-start space-x-2 my-1 leading-relaxed ${indentLevel > 0 ? (indentLevel === 1 ? 'ml-3' : 'ml-6') : ''}`
          },
          [
            React.createElement(
              'span',
              {
                key: 'num-badge',
                className: 'w-4 h-4 sm:w-5 sm:h-5 rounded bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 font-black text-[10px] sm:text-[11px] flex items-center justify-center shrink-0 mt-0.5 select-none shadow-xs'
              },
              num
            ),
            React.createElement('div', { key: 'num-content', className: 'flex-1 font-medium' }, parseInline(itemText, `num-${i}`))
          ]
        )
      );
      continue;
    }

    // Normal Paragraph line
    elements.push(
      React.createElement(
        'div',
        { key: `line-${i}`, className: 'leading-relaxed' },
        parseInline(line, `line-${i}`)
      )
    );
  }

  return React.createElement('div', { className: `markdown-content space-y-1 ${className}` }, elements);
}

// Helper: Format seconds to MM:SS
function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function ExamSelectView({ exams, examHistory, onSelectExam }) {

    let list = exams;
    if (examCategory === 'sina') {
      list = exams.filter(e => e.id.includes('sina'));
    } else if (examCategory === 'latest') {
      list = exams.filter(e => {
        const num = parseInt(e.id.replace('exam-', ''));
        return num >= 41 && num <= 48;
      });
    } else if (examCategory === 'past') {
      list = exams.filter(e => {
        const num = parseInt(e.id.replace('exam-', ''));
        return (num >= 35 && num <= 40) || (e.id.includes('mock') && !e.id.includes('sina'));
      });
    }
    return list;
  }, [exams, examCategory]);

// === ExamRunnerView.js ===
// ADsP Master App - Exam Runner View (Core Solving Engine)
// Timed Exam, OMR Sheet, Immediate Feedback, Scoring, Pass/Fail Report

function ExamRunnerView({
  exam,
  mode,
  subjectFilter,
  bookmarks,
  onToggleBookmark,
  onAddWrongQuestion,
  onFinishExam,
  onExit
}) {
  // Filter questions based on subjectFilter
  const questions = useMemo(() => {
    if (!exam || !exam.questions) return [];
    if (subjectFilter === 'all') return exam.questions;
    return exam.questions.filter(q => q.subjectId === Number(subjectFilter));
  }, [exam, subjectFilter]);

  // Current question index (0-indexed)
  const [currentIndex, setCurrentIndex] = useState(0);

  // User answers mapping: { [questionId]: optionIndex }
  const [userAnswers, setUserAnswers] = useState({});

  // Practice mode: track which questions have shown explanation
  const [showExplanationMap, setShowExplanationMap] = useState({});

  // Exam timer (seconds remaining)
  const totalSeconds = (exam?.timeLimitMinutes || 90) * 60;
  const [timeLeft, setTimeLeft] = useState(totalSeconds);
  const [isTimerPaused, setIsTimerPaused] = useState(false);

  // State: 'solving' | 'submitted'
  const [examStatus, setExamStatus] = useState('solving');
  const [examResult, setExamResult] = useState(null);

  // Timer effect (only in 'real' mode and when solving)
  useEffect(() => {
    if (mode !== 'real' || examStatus !== 'solving' || isTimerPaused) return;

    const timer = setInterval(() => {
      setTimeLeft(prev => {
        if (prev <= 1) {
          clearInterval(timer);
          handleSubmitExam();
          return 0;
        }
        return prev - 1;
      });
    }, 1000);

    return () => clearInterval(timer);
  }, [mode, examStatus, isTimerPaused]);

  const currentQ = questions[currentIndex] || questions[0];
  const isBookmarked = currentQ ? bookmarks.includes(currentQ.id) : false;

  // Select an option
  const handleSelectOption = (optIndex) => {
    if (examStatus === 'submitted') return; // Read-only after submit

    setUserAnswers(prev => ({
      ...prev,
      [currentQ.id]: optIndex
    }));

    if (mode === 'practice') {
      setShowExplanationMap(prev => ({
        ...prev,
        [currentQ.id]: true
      }));

      // Check if wrong and record
      if (optIndex !== currentQ.answer) {
        onAddWrongQuestion(currentQ);
      }
    }
  };

  // Submit and grade the exam
  const handleSubmitExam = () => {
    let sub1Total = 0, sub1Correct = 0;
    let sub2Total = 0, sub2Correct = 0;
    let sub3Total = 0, sub3Correct = 0;
    const wrongList = [];

    questions.forEach(q => {
      const selected = userAnswers[q.id];
      const isCorrect = selected === q.answer;

      if (q.subjectId === 1) {
        sub1Total += 1;
        if (isCorrect) sub1Correct += 1;
      } else if (q.subjectId === 2) {
        sub2Total += 1;
        if (isCorrect) sub2Correct += 1;
      } else {
        sub3Total += 1;
        if (isCorrect) sub3Correct += 1;
      }

      if (!isCorrect) {
        wrongList.push(q);
      }
    });

    const sub1Score = sub1Correct * 2;
    const sub2Score = sub2Correct * 2;
    const sub3Score = sub3Correct * 2;
    const totalScore = sub1Score + sub2Score + sub3Score;

    // 과락 판정 (1과목 8점 이상, 2과목 8점 이상, 3과목 24점 이상)
    // When partial subject is tested, only check tested subjects
    const sub1Failed = sub1Total > 0 && sub1Score < (sub1Total * 2 * 0.4);
    const sub2Failed = sub2Total > 0 && sub2Score < (sub2Total * 2 * 0.4);
    const sub3Failed = sub3Total > 0 && sub3Score < (sub3Total * 2 * 0.4);
    const hasSubjectFailure = sub1Failed || sub2Failed || sub3Failed;

    const totalQuestionsTested = questions.length;
    const maxScore = totalQuestionsTested * 2;
    const percentage = Math.round((totalScore / maxScore) * 100);
    const isPass = percentage >= 60 && !hasSubjectFailure;

    const result = {
      examId: exam.id,
      examTitle: exam.title,
      date: new Date().toLocaleDateString('ko-KR'),
      totalScore,
      maxScore,
      percentage,
      isPass,
      hasSubjectFailure,
      sub1Score,
      sub1Total: sub1Total * 2,
      sub1Failed,
      sub2Score,
      sub2Total: sub2Total * 2,
      sub2Failed,
      sub3Score,
      sub3Total: sub3Total * 2,
      sub3Failed,
      timeSpent: totalSeconds - timeLeft,
      wrongQuestionsList: wrongList,
      userAnswers
    };

    setExamResult(result);
    setExamStatus('submitted');
    onFinishExam(result);
  };

  // Render Result Screen if submitted
  if (examStatus === 'submitted' && examResult) {
    return (
      <div className="space-y-6 animate-fadeIn pb-12">
        {/* Result Header Banner */}
        <div className={`rounded-3xl p-6 sm:p-10 text-white shadow-xl ${
          examResult.isPass
            ? 'bg-gradient-to-r from-emerald-600 via-teal-600 to-indigo-600 shadow-emerald-500/20'
            : 'bg-gradient-to-r from-rose-600 via-pink-600 to-indigo-700 shadow-rose-500/20'
        }`}>
          <div className="flex flex-col md:flex-row items-center justify-between gap-6">
            <div className="space-y-3 text-center md:text-left">
              <div className="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-white/20 backdrop-blur-md text-xs font-bold">
                <span>{examResult.isPass ? '🎉 축하합니다!' : '💪 조금만 더 복습해보세요!'}</span>
                <span>{exam.title}</span>
              </div>
              <h1 className="text-3xl sm:text-5xl font-black">
                {examResult.isPass ? '합격 (PASS)' : '불합격 (FAIL)'}
              </h1>
              <p className="text-sm opacity-90 max-w-lg">
                {examResult.isPass
                  ? `총점 ${examResult.totalScore}점(${examResult.percentage}%)으로 합격 기준(60점) 및 전 과목 과락(40%)을 여유롭게 통과하셨습니다!`
                  : examResult.hasSubjectFailure
                    ? '총점과 무관하게 한 과목 이상에서 40% 미만 득점으로 과락이 발생하였습니다. 취약 과목을 집중 복습하세요!'
                    : `총점 ${examResult.totalScore}점으로 60점 합격 커트라인에 아쉽게 미달하였습니다. 틀린 문제 해설을 확인하세요.`}
              </p>
            </div>

            {/* Score Badge */}

              ></div>

            <p className="text-[11px] text-slate-400 mt-2">과락 기준: 8점 미만 (4문제 미만 정답 시 과락)</p>

            <p className="text-[11px] text-slate-400 mt-2">과락 기준: 24점 미만 (12문제 미만 정답 시 과락)</p>

        {/* Buttons: Review Questions or Exit */}
        <div className="flex flex-wrap items-center justify-between gap-3 pt-4">

          </span>
        </div>
      </div>
    );
  }

  if (!currentQ) {
    return (
      <div className="max-w-md mx-auto my-16 p-8 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl text-center space-y-4 shadow-sm">

  // Active question layout (Both Solving and Review modes)
  const isReviewMode = examStatus === 'review';
  const selectedAnswer = userAnswers[currentQ.id];
  const isAnswered = selectedAnswer !== undefined;
  const isCorrect = isAnswered && selectedAnswer === currentQ.answer;
  const showExplanation = isReviewMode || (mode === 'practice' && showExplanationMap[currentQ.id]);

  return (
    <div className="space-y-6 animate-fadeIn pb-16">

          <button

              isBookmarked
                ? 'bg-amber-50 dark:bg-amber-950/50 border-amber-300 text-amber-500'
                : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-400 hover:text-slate-600'

            title="문제 북마크"
          >
            {isBookmarked ? '⭐' : '☆'}
          </button>

          {!isReviewMode && (
            <button
              onClick={handleSubmitExam}
              className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-extrabold text-xs shadow-sm transition-all"
            >

            </button>

          {isReviewMode && (
            <button
              onClick={() => setExamStatus('submitted')}
              className="px-4 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-slate-200 font-bold text-xs"
            >

            </button>

        </div>
      </div>

      {/* Main Split: Left Question Card + Right OMR Sheet */}
      <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
        {/* Left Question Card Area (8 cols on lg) */}

            {/* Question Header */}
            <div className="flex items-start justify-between gap-4 mb-4">
              <span className="text-xl sm:text-2xl font-black text-indigo-600 dark:text-indigo-400">

              </span>
              <span className="text-xs px-2.5 py-1 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-500 font-semibold">

              </span>

            {/* Question Text */}
            <div className="text-base sm:text-lg font-bold text-slate-900 dark:text-slate-100 leading-relaxed mb-6">
              <MarkdownText content={currentQ.question} />
            </div>

            {/* 4 Choices */}
            <div className="space-y-3">
              {currentQ.options.map((option, idx) => {
                const isSelected = selectedAnswer === idx;
                const isCorrectOption = idx === currentQ.answer;

                let optStyle = 'border-slate-200 dark:border-slate-800 hover:border-indigo-300 dark:hover:border-indigo-700 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-200';
                
                if (showExplanation) {
                  // In explanation mode: Highlight correct option in green, wrong choice in red
                  if (isCorrectOption) {
                    optStyle = 'border-emerald-500 bg-emerald-50/70 dark:bg-emerald-950/40 text-emerald-800 dark:text-emerald-200 ring-2 ring-emerald-500 font-bold';
                  } else if (isSelected && !isCorrectOption) {
                    optStyle = 'border-rose-500 bg-rose-50/70 dark:bg-rose-950/40 text-rose-800 dark:text-rose-200 line-through';
                  }
                } else if (isSelected) {
                  optStyle = 'border-indigo-600 bg-indigo-50/80 dark:bg-indigo-950/50 text-indigo-700 dark:text-indigo-200 ring-2 ring-indigo-500 font-bold';
                }

                return (
                  <button
                    key={idx}
                    onClick={() => handleSelectOption(idx)}
                    disabled={isReviewMode}
                    className={`w-full text-left p-4 rounded-2xl border transition-all flex items-start space-x-3 text-sm leading-relaxed ${optStyle}`}
                  >
                    <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold shrink-0 mt-0.5 ${
                      showExplanation && isCorrectOption
                        ? 'bg-emerald-500 text-white'
                        : showExplanation && isSelected && !isCorrectOption
                          ? 'bg-rose-500 text-white'
                          : isSelected
                            ? 'bg-indigo-600 text-white'
                            : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400'

                    <span className="flex-1">

          {/* Deep Detailed Explanation Box (When active) */}

              {/* Answer result badge */}

                    isCorrect ? 'bg-emerald-500 text-white' : 'bg-rose-500 text-white'

                </div>
              </div>

              {/* 1. Core Explanation */}
              <div className="bg-white/80 dark:bg-slate-900/80 p-5 rounded-2xl border border-indigo-100 dark:border-indigo-900/50 shadow-sm space-y-2">

                  <span className="w-5 h-5 rounded-lg bg-indigo-100 dark:bg-indigo-900/60 text-indigo-600 dark:text-indigo-300 flex items-center justify-center text-xs">💡</span>

                </h4>
                <div className="text-xs sm:text-sm text-slate-700 dark:text-slate-200 leading-relaxed font-medium">
                  <MarkdownText content={currentQ.explanation} />
                </div>
              </div>

              {/* 2. 1:1 Per-Option Flaw Analysis (선지별 분리 카드형) */}
              {currentQ.wrongOptionsAnalysis && Object.keys(currentQ.wrongOptionsAnalysis).length > 0 && (
                <div className="space-y-3 pt-2">
                  <div className="flex items-center justify-between">
                    <h4 className="text-xs font-black uppercase text-indigo-700 dark:text-indigo-400 flex items-center space-x-2">
                      <span className="w-5 h-5 rounded-lg bg-indigo-100 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-300 flex items-center justify-center text-xs">🎯</span>

                    <span className="text-[11px] font-bold text-slate-400 dark:text-slate-500">

                  <div className="grid grid-cols-1 gap-3">
                    {Object.entries(currentQ.wrongOptionsAnalysis).map(([idxKey, desc]) => {
                      const optNum = Number(idxKey);

                      const optText = currentQ.options && currentQ.options[optNum] ? currentQ.options[optNum] : '';
                      return (
                        <div

                          }`}
                        >
                          <div className="flex items-center justify-between mb-2">
                            <span className={`px-2.5 py-1 rounded-lg font-black text-xs flex items-center space-x-1.5 shadow-xs ${
                              isCorrectOpt

                            }`}>
                              <span>{isCorrectOpt ? '✓' : '✗'}</span>
                              <span>{isCorrectOpt ? `정답 선지 (${optNum + 1}번)` : `오답 선지 (${optNum + 1}번)`}</span>
                            </span>
                            <span className="text-[11px] font-bold text-slate-400 dark:text-slate-500">
                              선지 {optNum + 1}

                          </div>

                          {optText && (
                            <div className="font-semibold text-slate-800 dark:text-slate-200 text-xs sm:text-[13px] mb-3 px-3 py-2 bg-slate-100/70 dark:bg-slate-800/70 rounded-xl border border-slate-200/60 dark:border-slate-700/60">
                              "{optText}"
                            </div>
                          )}

                          <div className="text-xs sm:text-[13px] leading-relaxed space-y-2 font-medium">
                            <MarkdownText content={desc} />
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* 3. Easy Metaphor for Non-Majors */}
              {currentQ.conceptMetaphor && (
                <div className="pt-1">
                  <div className="bg-teal-50/80 dark:bg-teal-950/40 border border-teal-200/80 dark:border-teal-800/70 rounded-2xl p-4 flex items-start space-x-3">
                    <span className="text-2xl shrink-0 mt-0.5">🌱</span>
                    <div className="space-y-1">
                      <span className="text-xs font-black text-teal-800 dark:text-teal-300 block">
                        [3단계] 비전공자 눈높이 개념 비유
                      </span>
                      <div className="text-xs sm:text-sm text-teal-950 dark:text-teal-100 leading-relaxed font-medium">
                        <MarkdownText content={currentQ.conceptMetaphor} />
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* 4. Core Tip / 1-Second Exam Formula */}
              {currentQ.coreTip && (
                <div className="pt-1">
                  <div className="bg-amber-50/80 dark:bg-amber-950/40 border border-amber-200/80 dark:border-amber-800/70 rounded-2xl p-4 flex items-start space-x-3">
                    <span className="text-2xl shrink-0 mt-0.5">📌</span>
                    <div className="space-y-1">
                      <span className="text-xs font-black text-amber-800 dark:text-amber-300 block">
                        [4단계] 시험 직전 1초 암기 공식 & 함정 탈출 팁
                      </span>
                      <div className="text-xs sm:text-sm text-amber-950 dark:text-amber-100 font-semibold leading-relaxed">
                        <MarkdownText content={currentQ.coreTip} />
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>

        {/* Right OMR Sheet Area (4 cols on lg) */}
        <div className="lg:col-span-4 space-y-4">
          <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-5 shadow-sm sticky top-36">
            <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800 mb-3">
              <div className="flex items-center space-x-2">
                <span className="font-extrabold text-sm text-slate-800 dark:text-slate-100">OMR 답안지</span>
                <span className="text-xs bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded text-slate-500 font-semibold">
                  {Object.keys(userAnswers).length} / {questions.length} 마킹
                </span>
              </div>
            </div>

            {/* OMR Button Grid */}
            <div className="grid grid-cols-5 gap-2 max-h-[480px] overflow-y-auto pr-1">
              {questions.map((q, idx) => {
                const marked = userAnswers[q.id];
                const isCurrent = currentIndex === idx;
                const isWrong = isReviewMode && marked !== q.answer;
                const isRight = isReviewMode && marked === q.answer;

                let btnStyle = 'bg-slate-50 dark:bg-slate-800/80 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300';

                if (isReviewMode) {
                  btnStyle = isRight
                    ? 'bg-emerald-500 text-white border-emerald-600'
                    : 'bg-rose-500 text-white border-rose-600';
                } else if (marked !== undefined) {
                  btnStyle = 'bg-indigo-600 text-white border-indigo-700 font-bold';
                }

                if (isCurrent) {
                  btnStyle += ' ring-2 ring-indigo-400 ring-offset-2 dark:ring-offset-slate-900';
                }

                return (
                  <button
                    key={q.id}
                    onClick={() => setCurrentIndex(idx)}
                    className={`py-2 rounded-xl text-xs font-bold border transition-all flex flex-col items-center justify-center ${btnStyle}`}
                  >
                    <span>{idx + 1}</span>
                    <span className="text-[10px] opacity-80">
                      {marked !== undefined ? `${marked + 1}번` : '-'}
                    </span>
                  </button>
                );
              })}
            </div>

            {/* Submit button inside OMR */}
            {!isReviewMode && (
              <button
                onClick={handleSubmitExam}
                className="w-full mt-4 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-xs shadow-md transition-all text-center"
              >
                시험 완료 및 채점하기
              </button>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

// 1. OX QUIZ SECTION
// -------------------------------------------------------------------
function OXQuizSection({ oxList }) {
  const [index, setIndex] = useState(0);
  const [userChoice, setUserChoice] = useState(null); // true or false
  const [streak, setStreak] = useState(0);

  const current = oxList[index] || oxList[0];
  const isAnswered = userChoice !== null;
  const isCorrect = isAnswered && userChoice === current.isCorrect;

  const handleChoose = (choice) => {
    if (isAnswered) return;
    setUserChoice(choice);
    if (choice === current.isCorrect) {
      setStreak(prev => prev + 1);
    } else {
      setStreak(0);
    }
  };

  const handleNext = () => {
    setUserChoice(null);
    setIndex(prev => (prev + 1) % oxList.length);
  };

  return (
    <div className="max-w-2xl mx-auto space-y-6">
      {/* Quiz Progress & Streak Header */}
      <div className="flex items-center justify-between text-xs text-slate-500 font-bold">
        <span>문항 {index + 1} / {oxList.length}</span>
        <div className="flex items-center space-x-1.5 bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-300 px-3 py-1 rounded-full border border-amber-200 dark:border-amber-800">
          <span>🔥</span>
          <span>연속 정답: {streak}회</span>
        </div>
      </div>

      {/* Card */}
      <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 sm:p-10 shadow-sm text-center space-y-6">
        <div className="inline-block px-3 py-1 rounded-full text-xs font-bold bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-800">
          {current.subject === 1 ? '1과목 데이터 이해' : current.subject === 2 ? '2과목 데이터분석 기획' : '3과목 데이터 분석'}
        </div>

        <h3 className="text-lg sm:text-xl font-extrabold text-slate-900 dark:text-slate-100 leading-relaxed max-w-xl mx-auto">
          "{current.statement}"
        </h3>

        {/* Big O and X Buttons */}
        <div className="grid grid-cols-2 gap-4 max-w-sm mx-auto pt-2">
          <button
            onClick={() => handleChoose(true)}
            disabled={isAnswered}
            className={`py-6 rounded-3xl border-2 font-black text-3xl transition-all shadow-sm flex flex-col items-center justify-center space-y-1 ${
              isAnswered && current.isCorrect === true
                ? 'border-emerald-500 bg-emerald-500 text-white'
                : isAnswered && userChoice === true && !isCorrect
                  ? 'border-rose-500 bg-rose-500 text-white'
                  : 'border-slate-200 dark:border-slate-700 hover:border-emerald-500 hover:bg-emerald-50 dark:hover:bg-emerald-950/30 text-emerald-600 dark:text-emerald-400'
            }`}
          >
            <span>⭕</span>
            <span className="text-xs font-bold">참 (O)</span>
          </button>

          <button
            onClick={() => handleChoose(false)}
            disabled={isAnswered}
            className={`py-6 rounded-3xl border-2 font-black text-3xl transition-all shadow-sm flex flex-col items-center justify-center space-y-1 ${
              isAnswered && current.isCorrect === false
                ? 'border-emerald-500 bg-emerald-500 text-white'
                : isAnswered && userChoice === false && !isCorrect
                  ? 'border-rose-500 bg-rose-500 text-white'
                  : 'border-slate-200 dark:border-slate-700 hover:border-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/30 text-rose-600 dark:text-rose-400'
            }`}
          >
            <span>❌</span>
            <span className="text-xs font-bold">거짓 (X)</span>
          </button>
        </div>

        {/* Detailed Explanation upon answer */}
        {isAnswered && (
          <div className="pt-4 border-t border-slate-100 dark:border-slate-800 space-y-4 animate-fadeIn text-left">
            <div className={`p-4 rounded-2xl border ${
              isCorrect

                : 'bg-rose-50 dark:bg-rose-950/40 border-rose-200 dark:border-rose-800 text-rose-900 dark:text-rose-200'
            }`}>
              <div className="flex items-center space-x-2 font-black text-sm mb-1">
                <span>{isCorrect ? '🎉 정답입니다!' : '❌ 아쉽네요! 오답입니다.'}</span>
                <span>(실제 정답: {current.isCorrect ? 'O' : 'X'})</span>
              </div>
              <div className="text-xs leading-relaxed opacity-95">
                <MarkdownText content={current.explanation} />
              </div>
            </div>

            {current.tip && (
              <div className="bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800 rounded-xl p-3 text-xs text-amber-900 dark:text-amber-300 font-medium flex items-center space-x-2">

              </div>
            )}

            <button
              onClick={handleNext}
              className="w-full py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-sm shadow-md transition-all text-center"

              다음 OX 문제 풀기 →

          </div>
        )}

    </div>
  );
}

function ChosungQuizSection({ chosungList }) {

// -------------------------------------------------------------------
// 3. FLASHCARDS SECTION
// -------------------------------------------------------------------
function FlashcardSection({ flashcards, flashcardStatus, onUpdateStatus }) {
  const [subjectFilter, setSubjectFilter] = useState('all'); // 'all', 1, 2, 3
  const [statusFilter, setStatusFilter] = useState('all'); // 'all', 'memorized', 'review'
  const [flippedCards, setFlippedCards] = useState({});

  const toggleFlip = (cardId) => {
    setFlippedCards(prev => ({
      ...prev,
      [cardId]: !prev[cardId]
    }));
  };

  const filteredCards = useMemo(() => {
    return flashcards.filter(c => {
      const matchSubject = subjectFilter === 'all' || c.subject === Number(subjectFilter);
      const cardStat = flashcardStatus[c.id] || 'unmarked';
      const matchStatus = statusFilter === 'all' 
        ? true 
        : statusFilter === 'memorized' 
          ? cardStat === 'memorized' 
          : cardStat === 'review' || cardStat === 'unmarked';
      return matchSubject && matchStatus;
    });
  }, [flashcards, subjectFilter, statusFilter, flashcardStatus]);

  return (
    <div className="space-y-6">
      {/* Filter Bar */}
      <div className="flex flex-wrap items-center justify-between gap-3 bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800">
        <div className="flex flex-wrap items-center gap-2">
          <span className="text-xs font-bold text-slate-500">과목:</span>
          {[
            { id: 'all', label: '전체' },
            { id: 1, label: '1과목' },
            { id: 2, label: '2과목' },
            { id: 3, label: '3과목' },
          ].map(sub => (
            <button
              key={sub.id}
              onClick={() => setSubjectFilter(sub.id)}
              className={`px-3 py-1 rounded-lg text-xs font-bold transition-all ${
                subjectFilter === sub.id
                  ? 'bg-indigo-600 text-white'
                  : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'
              }`}
            >
              {sub.label}
            </button>
          ))}
        </div>

        <div className="flex items-center gap-2">
          <span className="text-xs font-bold text-slate-500">상태:</span>
          {[
            { id: 'all', label: '전체 보기' },
            { id: 'review', label: '다시보기 🔁' },
            { id: 'memorized', label: '외웠어요 ✅' },
          ].map(st => (
            <button
              key={st.id}
              onClick={() => setStatusFilter(st.id)}
              className={`px-3 py-1 rounded-lg text-xs font-bold transition-all ${
                statusFilter === st.id
                  ? 'bg-purple-600 text-white'
                  : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'
              }`}
            >
              {st.label}
            </button>
          ))}
        </div>
      </div>

      <p className="text-xs text-slate-500 dark:text-slate-400">
        * 카드를 클릭하면 3D 회전하며 상세 정의와 시험 팁이 표시됩니다.
      </p>

      {/* Flashcards Grid */}
      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        {filteredCards.map((card) => {
          const isFlipped = flippedCards[card.id];
          const status = flashcardStatus[card.id];

          return (
            <div
              key={card.id}
              className="relative min-h-[220px] rounded-3xl cursor-pointer perspective-1000 select-none group"
              onClick={() => toggleFlip(card.id)}
            >
              <div className={`w-full h-full min-h-[220px] p-6 rounded-3xl border transition-all duration-300 flex flex-col justify-between shadow-sm hover:shadow-md ${
                isFlipped
                  ? 'bg-indigo-50 dark:bg-indigo-950/60 border-indigo-300 dark:border-indigo-700'
                  : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 hover:border-indigo-300'
              }`}>
                {/* Card Top Tag */}
                <div className="flex items-center justify-between">
                  <span className="text-[11px] font-extrabold px-2.5 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                    {card.subject}과목
                  </span>
                  <span className="text-[11px] text-slate-400 font-semibold">
                    {isFlipped ? '뒤집기 ↺' : '클릭하여 해설 보기 ↻'}
                  </span>
                </div>

                {/* Card Body */}
                <div className="my-auto py-2">
                  {!isFlipped ? (
                    <div className="text-center">
                      <span className="text-xs uppercase font-extrabold tracking-widest text-indigo-500 block mb-1">
                        핵심 용어
                      </span>
                      <h4 className="text-xl font-black text-slate-900 dark:text-slate-100">
                        {card.term}
                      </h4>
                    </div>
                  ) : (
                    <div className="space-y-2 text-left animate-fadeIn">
                      <h5 className="font-extrabold text-sm text-indigo-700 dark:text-indigo-300">
                        {card.term}
                      </h5>
                      <div className="text-xs text-slate-700 dark:text-slate-200 leading-relaxed">
                        <MarkdownText content={card.definition} />
                      </div>
                      {card.tip && (
                        <div className="text-[11px] text-amber-700 dark:text-amber-400 font-medium pt-1 border-t border-indigo-200/50 dark:border-indigo-800/50 flex items-start space-x-1.5">
                          <span className="shrink-0">📌</span>
                          <span className="flex-1"><MarkdownText content={card.tip} className="inline" /></span>
                        </div>
                      )}
                    </div>
                  )}
                </div>

                {/* Card Bottom Controls */}
                <div 
                  className="flex items-center justify-between pt-3 border-t border-slate-100 dark:border-slate-800"
                  onClick={e => e.stopPropagation()} // Prevent card flip on button click
                >
                  <button
                    onClick={() => onUpdateStatus(card.id, 'review')}
                    className={`px-3 py-1 rounded-xl text-xs font-bold transition-all ${
                      status === 'review'
                        ? 'bg-rose-500 text-white shadow-sm'
                        : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200'
                    }`}
                  >
                    다시보기 🔁
                  </button>
                  <button
                    onClick={() => onUpdateStatus(card.id, 'memorized')}
                    className={`px-3 py-1 rounded-xl text-xs font-bold transition-all ${
                      status === 'memorized'
                        ? 'bg-emerald-500 text-white shadow-sm'
                        : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200'
                    }`}
                  >
                    외웠어요 ✅
                  </button>
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// -------------------------------------------------------------------
// 4. SPEED 4-CHOICE TERM QUIZ SECTION
// -------------------------------------------------------------------
function SpeedQuizSection({ speedList }) {
  const [index, setIndex] = useState(0);
  const [selectedIdx, setSelectedIdx] = useState(null);
  const [score, setScore] = useState(0);

  const current = speedList[index] || speedList[0];
  const isAnswered = selectedIdx !== null;
  const isCorrect = isAnswered && selectedIdx === current.answer;

  const handleSelect = (idx) => {
    if (isAnswered) return;
    setSelectedIdx(idx);
    if (idx === current.answer) {
      setScore(prev => prev + 10);
    }
  };

  const handleNext = () => {
    setSelectedIdx(null);
    setIndex(prev => (prev + 1) % speedList.length);
  };

  return (
    <div className="max-w-2xl mx-auto space-y-6">
      <div className="flex items-center justify-between text-xs text-slate-500 font-bold">
        <span>스피드 문항 {index + 1} / {speedList.length}</span>
        <div className="text-indigo-600 dark:text-indigo-400 font-black text-sm">
          점수: {score}점
        </div>
      </div>

      <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 sm:p-10 shadow-sm space-y-6">
        <h3 className="text-base sm:text-lg font-bold text-slate-900 dark:text-slate-100 leading-relaxed">
          {current.question}
        </h3>

        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          {current.options.map((opt, idx) => {
            const isSelected = selectedIdx === idx;
            const isRight = idx === current.answer;

            let btnStyle = 'border-slate-200 dark:border-slate-800 hover:border-indigo-400 text-slate-800 dark:text-slate-200';
            if (isAnswered) {
              if (isRight) {
                btnStyle = 'border-emerald-500 bg-emerald-500 text-white font-bold ring-2 ring-emerald-400';
              } else if (isSelected) {
                btnStyle = 'border-rose-500 bg-rose-500 text-white';
              }
            }

            return (
              <button
                key={idx}
                onClick={() => handleSelect(idx)}
                disabled={isAnswered}
                className={`p-4 rounded-2xl border text-sm font-bold transition-all text-left flex items-center space-x-3 ${btnStyle}`}
              >
                <span className="w-6 h-6 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 text-xs flex items-center justify-center shrink-0">
                  {idx + 1}
                </span>
                <span>{opt}</span>
              </button>
            );
          })}
        </div>

        {isAnswered && (
          <div className="pt-4 border-t border-slate-100 dark:border-slate-800 space-y-3 animate-fadeIn">
            <p className="text-xs text-slate-600 dark:text-slate-300">
              💡 <strong>해설:</strong> {current.explanation}
            </p>
            <button
              onClick={handleNext}
              className="w-full py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-sm shadow-md transition-all text-center"
            >
              다음 문제 →
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// === WrongNotesView.js ===
// ADsP Master App - Wrong Notes & Bookmarks View

function WrongNotesView({
  wrongQuestions,
  bookmarks,
  allExams,
  onRemoveWrongQuestion,
  onToggleBookmark
}) {
  const [activeTab, setActiveTab] = useState('wrong'); // 'wrong' or 'bookmark'
  const [subjectFilter, setSubjectFilter] = useState('all'); // 'all', 1, 2, 3
  const [expandedId, setExpandedId] = useState(null);

  // Retrieve bookmarked question objects from allExams
  const bookmarkedQuestions = useMemo(() => {
    const list = [];
    (allExams || []).forEach(exam => {
      (exam?.questions || []).forEach(q => {
        if (q && (bookmarks || []).includes(q.id) && !list.some(item => item.id === q.id)) {
          list.push(q);
        }
      });
    });
    return list;
  }, [allExams, bookmarks]);

  // Current active list
  const currentList = activeTab === 'wrong' ? (wrongQuestions || []) : bookmarkedQuestions;

  // Filtered by subject
  const filteredList = useMemo(() => {
    return (currentList || []).filter(q => {
      if (!q) return false;
      if (subjectFilter === 'all') return true;
      return q.subjectId === Number(subjectFilter);
    });
  }, [currentList, subjectFilter]);

  return (
    <div className="space-y-6 animate-fadeIn pb-16">
      {/* Top Header */}
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-200 dark:border-slate-800">
        <div>
          <h1 className="text-2xl font-black text-slate-900 dark:text-slate-100 flex items-center space-x-2">
            <span>📑</span>
            <span>오답노트 & 북마크 보관함</span>
          </h1>
          <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">
            틀렸던 문제와 중요하다고 표시한 문제들을 완벽하게 내 것으로 만들 때까지 반복 복습하세요.
          </p>
        </div>

        {/* Tab switcher: Wrong vs Bookmark */}
        <div className="flex gap-2">
          <button
            onClick={() => setActiveTab('wrong')}
            className={`px-4 py-2 rounded-xl text-xs font-extrabold transition-all flex items-center space-x-1.5 ${
              activeTab === 'wrong'
                ? 'bg-rose-600 text-white shadow-md shadow-rose-500/25'
                : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'
            }`}
          >
            <span>❌</span>
            <span>오답노트 ({wrongQuestions.length})</span>
          </button>
          <button
            onClick={() => setActiveTab('bookmark')}
            className={`px-4 py-2 rounded-xl text-xs font-extrabold transition-all flex items-center space-x-1.5 ${
              activeTab === 'bookmark'
                ? 'bg-amber-500 text-white shadow-md shadow-amber-500/25'
                : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'
            }`}
          >
            <span>⭐</span>
            <span>북마크 ({bookmarkedQuestions.length})</span>
          </button>
        </div>
      </div>

      {/* Subject Filter Bar */}
      <div className="flex items-center space-x-2">
        <span className="text-xs font-bold text-slate-500">과목 필터:</span>
        {[
          { id: 'all', label: '전체' },
          { id: 1, label: '1과목 데이터 이해' },
          { id: 2, label: '2과목 데이터분석 기획' },
          { id: 3, label: '3과목 데이터 분석' },
        ].map(sub => (
          <button
            key={sub.id}
            onClick={() => setSubjectFilter(sub.id)}
            className={`px-3 py-1 rounded-lg text-xs font-bold transition-all ${
              subjectFilter === sub.id

                : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-slate-900'

          <h3 className="text-base font-bold text-slate-800 dark:text-slate-200">
            {activeTab === 'wrong' ? '등록된 오답 문제가 없습니다!' : '북마크한 문제가 없습니다!'}

          <p className="text-xs text-slate-400 max-w-sm mx-auto leading-relaxed">
            {activeTab === 'wrong'

                      <button

                        title="완벽히 이해했으므로 오답노트에서 제외"
                      >
                        ✓ 이제 알아요! (삭제)
                      </button>
                    )}
                  </div>
                </div>

                {/* Question Text */}
                <div className="text-sm sm:text-base font-bold text-slate-900 dark:text-slate-100 leading-relaxed">
                  <MarkdownText content={q.question} />

                {/* Options preview with correct answer highlight */}
                <div className="space-y-1.5">

                                  </div>
                                  <div className="text-xs leading-relaxed pl-0.5">
                                    <MarkdownText content={text} />
                                  </div>
                                </div>
                              );
                            })}
                          </div>

                      )}

                      {/* 3. Easy Metaphor for Non-Majors */}
                      {q.conceptMetaphor && (
                        <div className="bg-teal-50/80 dark:bg-teal-950/40 border border-teal-200/80 dark:border-teal-800/70 rounded-2xl p-3.5 flex items-start space-x-2.5">

                          <div className="space-y-0.5">
                            <span className="text-xs font-black text-teal-800 dark:text-teal-300 block">
                              [3단계] 비전공자 눈높이 개념 비유
                            </span>
                            <div className="text-xs text-teal-950 dark:text-teal-100 leading-relaxed font-medium">
                              <MarkdownText content={q.conceptMetaphor} />
                            </div>
                          </div>
                        </div>
                      )}

                      {/* 4. Core Tip */}
                      {q.coreTip && (
                        <div className="bg-amber-50/80 dark:bg-amber-950/40 border border-amber-200/80 dark:border-amber-800/70 rounded-2xl p-3.5 flex items-start space-x-2.5">

                          <div className="space-y-0.5">
                            <span className="text-xs font-black text-amber-800 dark:text-amber-300 block">
                              [4단계] 시험 직전 1초 암기 공식 & 함정 탈출 팁
                            </span>
                            <div className="text-xs text-amber-950 dark:text-amber-100 font-semibold leading-relaxed">
                              <MarkdownText content={q.coreTip} />
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// === SearchView.js ===
// ADsP Master App - Full Search & Keyword Glossary View

function SearchView({ exams, quizzes, bookmarks, onToggleBookmark }) {
  const [query, setQuery] = useState('');
  const [activeCategory, setActiveCategory] = useState('all'); // 'all', 'questions', 'terms'
  const [expandedQId, setExpandedQId] = useState(null);

  // Search across questions
  const matchedQuestions = useMemo(() => {
    if (!query || !query.trim()) return [];
    const qLower = query.toLowerCase().trim();
    const results = [];
    (exams || []).forEach(exam => {
      (exam.questions || []).forEach(q => {
        const inQuestion = (q.question || '').toLowerCase().includes(qLower);
        const inOptions = (q.options || []).some(opt => (opt || '').toLowerCase().includes(qLower));
        const inExpl = (q.explanation || '').toLowerCase().includes(qLower);
        const inTip = q.coreTip ? q.coreTip.toLowerCase().includes(qLower) : false;
        if (inQuestion || inOptions || inExpl || inTip) {
          results.push(q);
        }
      });
    });
    return results;
  }, [exams, query]);

  // Search across flashcards & quizzes
  const matchedTerms = useMemo(() => {
    if (!query || !query.trim()) return [];
    const qLower = query.toLowerCase().trim();
    const cards = quizzes?.flashcards || [];
    return cards.filter(c => 
      (c.term || '').toLowerCase().includes(qLower) || 
      (c.definition || '').toLowerCase().includes(qLower) ||
      (c.tip && c.tip.toLowerCase().includes(qLower))
    );
  }, [quizzes, query]);

  // Popular search keywords
  const popularKeywords = [
    'CRISP-DM', '다중공선성', '이상치 IQR', '정상성 차분', 'ROC AUC', 
    '의사결정나무', '로지스틱 회귀', 'K-means', '향상도 Lift', '암묵지 형식지'
  ];

  return (
    <div className="space-y-6 animate-fadeIn pb-16 max-w-4xl mx-auto">
      {/* Header & Search Bar */}
      <div className="text-center space-y-3 pb-4">
        <h1 className="text-2xl sm:text-3xl font-black text-slate-900 dark:text-slate-100 flex items-center justify-center space-x-2">
          <span>🔍</span>
          <span>ADsP 통합 검색 & 개념 사전</span>
        </h1>
        <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400">
          기출문제 800문항 (전 16개 회차), 상세 해설, 오답 분석, 핵심 용어 사전을 한 번에 검색하세요.
        </p>

        {/* Input */}
        <div className="relative max-w-xl mx-auto pt-2">
          <input
            type="text"
            value={query}
            onChange={e => setQuery(e.target.value)}
            placeholder="검색어를 입력하세요 (예: ROC, 정상성, VIF, 암묵지)"
            className="w-full px-5 py-3.5 pl-12 rounded-2xl border-2 border-indigo-200 dark:border-indigo-800 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 font-bold text-sm shadow-sm focus:outline-none focus:border-indigo-500 transition-all"
          />
          <span className="absolute left-4 top-5 text-lg text-slate-400">🔍</span>
          {query && (
            <button
              onClick={() => setQuery('')}
              className="absolute right-4 top-4 text-xs font-bold bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded-lg text-slate-500"
            >
              지우기
            </button>
          )}
        </div>

        {/* Popular Tags */}
        <div className="flex flex-wrap items-center justify-center gap-1.5 pt-2">
          <span className="text-xs text-slate-400 font-semibold mr-1">추천 검색:</span>
          {popularKeywords.map(kw => (
            <button
              key={kw}
              onClick={() => setQuery(kw)}
              className="px-2.5 py-1 rounded-lg text-xs font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-indigo-50 hover:text-indigo-600 transition-colors"
            >
              #{kw}
            </button>
          ))}
        </div>
      </div>

      {/* Category selector if results exist */}
      {query && (
        <div className="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3">
          <div className="flex gap-2">
            <button
              onClick={() => setActiveCategory('all')}
              className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${
                activeCategory === 'all'
                  ? 'bg-indigo-600 text-white'
                  : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'
              }`}
            >
              전체 ({matchedQuestions.length + matchedTerms.length})
            </button>
            <button
              onClick={() => setActiveCategory('terms')}
              className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${
                activeCategory === 'terms'
                  ? 'bg-indigo-600 text-white'
                  : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'
              }`}
            >
              핵심 용어 ({matchedTerms.length})
            </button>
            <button
              onClick={() => setActiveCategory('questions')}
              className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${
                activeCategory === 'questions'
                  ? 'bg-indigo-600 text-white'
                  : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'
              }`}
            >
              기출문제 ({matchedQuestions.length})
            </button>
          </div>
          <span className="text-xs text-slate-400">
            총 {matchedQuestions.length + matchedTerms.length}건 검색됨
          </span>
        </div>
      )}

      {/* Results List */}
      <div className="space-y-6">
        {/* 1. Matched Terms */}
        {(activeCategory === 'all' || activeCategory === 'terms') && matchedTerms.length > 0 && (
          <div className="space-y-3">
            <h3 className="text-sm font-black text-slate-800 dark:text-slate-200 flex items-center space-x-1.5">
              <span>📖</span>
              <span>핵심 용어 사전 결과 ({matchedTerms.length})</span>
            </h3>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              {matchedTerms.map(term => (
                <div
                  key={term.id}
                  className="bg-white dark:bg-slate-900 border border-indigo-100 dark:border-slate-800 rounded-2xl p-4 shadow-sm space-y-2"
                >
                  <div className="flex items-center justify-between">
                    <span className="font-black text-sm text-indigo-600 dark:text-indigo-400">
                      {term.term}
                    </span>
                    <span className="text-[10px] bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded font-bold">
                      {term.subject}과목
                    </span>
                  </div>
                  <div className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
                    <MarkdownText content={term.definition} />

// LocalStorage Keys
const STORAGE_KEYS = {
  THEME: 'adsp_theme',
  EXAM_HISTORY: 'adsp_exam_history',
  WRONG_QUESTIONS: 'adsp_wrong_questions',
  BOOKMARKS: 'adsp_bookmarks',
  FLASHCARD_STATUS: 'adsp_flashcard_status',
  SOLVED_QUIZZES: 'adsp_solved_quizzes',
  DAILY_STREAK: 'adsp_daily_streak'
};

// Helper: LocalStorage getter/setter
const storage = {
  get: (key, defaultValue) => {
    try {
      const item = localStorage.getItem(key);
      return item ? JSON.parse(item) : defaultValue;
    } catch (e) {
      console.warn("Storage error", e);
      return defaultValue;
    }
  },
  set: (key, value) => {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {
      console.warn("Storage save error", e);
    }
  }
};

// Confetti trigger helper
const triggerConfetti = () => {
  if (window.confetti) {
    window.confetti({
      particleCount: 100,
      spread: 70,
      origin: { y: 0.6 }
    });
    setTimeout(() => {
      window.confetti({
        particleCount: 50,
        angle: 60,
        spread: 55,
        origin: { x: 0 }
      });
      window.confetti({
        particleCount: 50,
        angle: 120,
        spread: 55,
        origin: { x: 1 }
      });
    }, 250);
  }
};

    // Error Boundary Component
    class GlobalErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary caught:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-50 dark:bg-slate-950 flex items-center justify-center p-6 text-center">
              <div className="max-w-md w-full p-8 bg-white dark:bg-slate-900 rounded-3xl border border-rose-200 dark:border-rose-900 shadow-xl space-y-4">
                <div className="w-12 h-12 mx-auto rounded-2xl bg-rose-100 dark:bg-rose-950/60 text-rose-600 flex items-center justify-center text-2xl font-bold">
                  ⚠️
                </div>
                <h2 className="text-xl font-black text-slate-900 dark:text-slate-100">화면 표시 중 오류가 발생했습니다</h2>
                <p className="text-xs text-rose-500 font-mono bg-rose-50 dark:bg-rose-950/40 p-3 rounded-xl break-all">
                  {this.state.error?.toString() || '오류 발생'}
                </p>
                <button
                  onClick={() => { this.setState({ hasError: false, error: null }); window.location.reload(); }}
                  className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-md transition-all"
                >
                  새로고침하여 복구하기
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // Mount
    const rootElement = document.getElementById('root');
    if (rootElement && window.ADSP_APP) {
      const root = ReactDOM.createRoot(rootElement);
      root.render(
        <GlobalErrorBoundary>
          <window.ADSP_APP />
        </GlobalErrorBoundary>
      );
    }
  </script>

    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          console.log('[PWA] Service Worker registered successfully', reg.scope);
        }).catch(err => {
          console.log('[PWA] Service Worker registration failed', err);
        });
      });
    }
  </script>
</body>
